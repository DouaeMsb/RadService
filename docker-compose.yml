services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ganzGeheim
      MARIADB_DATABASE: radservice
      MARIADB_USER: public
      MARIADB_PASSWORD: public
    volumes:
      - ./mariadb.setup:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"

volumes:
  db_data:
